# 端口：宿主机 `${KB_RAG_HOST_PORT:-8788}` → 容器 `${PORT:-8787}`（均可写在仓库根 `.env` 供 compose 插值）
services:
  kb-rag:
    build: .
    ports:
      - "${KB_RAG_HOST_PORT:-8788}:${PORT:-8787}"
    env_file:
      - .env
    volumes:
      - ./kb_store:/app/kb_store
      - ./sessions:/app/sessions
      - ./kb_uploads:/app/kb_uploads
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:${PORT:-8787}/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
